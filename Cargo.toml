[package]
name = "aerox5"
version = "0.2.0"
edition = "2021"
description = "Configuration tool (GUI + CLI) for the SteelSeries Aerox 5 Wireless mouse"
license = "MIT"

[[bin]]
name = "aerox5"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
toml = "0.8"

[profile.release]
lto = "thin"
strip = true
